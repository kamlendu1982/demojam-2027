---
# Every secret value comes from vault.yml (vault_* variables).
controller_credentials:
  - name: DemoJam | Automation Hub
    description: Red Hat certified content (ansible.platform, ansible.controller) for project syncs
    organization: "{{ demojam_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: https://console.redhat.com/api/automation-hub/content/published/
      auth_url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      token: "{{ vault_automation_hub_token }}"

  # Also loaded into ssh-agent for the switches' ProxyCommand jump through
  # the Container Lab host — see README "Reaching the switches".
  - name: DemoJam | Ubuntu SSH
    description: SSH key for the Container Lab (Ubuntu) host and the switch jump
    organization: "{{ demojam_organization }}"
    credential_type: Machine
    inputs:
      username: "{{ demojam_ubuntu_user }}"
      ssh_key_data: "{{ vault_ubuntu_ssh_private_key }}"

  - name: DemoJam | RHEL SSH
    description: SSH key for the NetBox (RHEL) host
    organization: "{{ demojam_organization }}"
    credential_type: Machine
    inputs:
      username: "{{ demojam_rhel_user }}"
      ssh_key_data: "{{ vault_rhel_ssh_private_key }}"
      become_method: sudo

  - name: DemoJam | Arista Switch Login
    organization: "{{ demojam_organization }}"
    credential_type: DemoJam | Arista Switch Login
    inputs:
      username: "{{ demojam_arista_user }}"
      password: "{{ vault_arista_password }}"
      enable_password: "{{ vault_arista_enable_password | default('') }}"

  - name: DemoJam | NetBox API
    organization: "{{ demojam_organization }}"
    credential_type: DemoJam | NetBox API
    inputs:
      url: "{{ demojam_netbox_url }}"
      token: "{{ vault_netbox_api_token }}"

  - name: DemoJam | NetBox Admin
    organization: "{{ demojam_organization }}"
    credential_type: DemoJam | NetBox Admin
    inputs:
      username: "{{ demojam_netbox_admin_user }}"
      password: "{{ vault_netbox_admin_password }}"
      email: "{{ demojam_netbox_admin_email }}"

  - name: DemoJam | Network Drift Secrets
    organization: "{{ demojam_organization }}"
    credential_type: DemoJam | Network Drift Secrets
    inputs:
      maas_api_key: "{{ vault_maas_api_key }}"
      github_mcp_token: "{{ vault_github_mcp_token }}"
      aap_url: "{{ vault_aap_hostname }}"
      aap_token: "{{ vault_drift_aap_token }}"

  # Used only by "DemoJam | Apply Config as Code" (self-apply).
  - name: DemoJam | CaC AAP Admin
    organization: "{{ demojam_organization }}"
    credential_type: Red Hat Ansible Automation Platform
    inputs:
      host: "{{ vault_aap_hostname }}"
      username: "{{ vault_aap_username }}"
      password: "{{ vault_aap_password }}"
      verify_ssl: false

  - name: DemoJam | CaC Vault
    organization: "{{ demojam_organization }}"
    credential_type: Vault
    inputs:
      vault_password: "{{ vault_cac_vault_password }}"
