- name: Splunk EDA Rulebook
  hosts: localhost
  gather_facts: false
  sources:
    - ansible.eda.event_source:

  rules:

    # -------------------------------------------------------------------------
    # DEBUG: Catch-all to inspect incoming events during development
    # -------------------------------------------------------------------------

    - name: Send to Workflow
      condition: event.payload is defined
      action:
        run_workflow_template:
          name: "DemoJamNetworkDriftManager"
          organization: "Default"
          job_args:
            extra_vars: "{{ event.meta }}"
            webhook_payload: "{{ event.payload }}"