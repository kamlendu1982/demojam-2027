---
# Custom credential types. Injector templates are rendered by AAP, not by
# Ansible, hence `!unsafe`.
controller_credential_types:
  - name: DemoJam | NetBox API
    description: NetBox URL + API token, for the drift pipeline (env) and onboarding playbook (extra vars)
    kind: cloud
    inputs:
      fields:
        - id: url
          type: string
          label: NetBox URL
        - id: token
          type: string
          label: NetBox API Token
          secret: true
      required: [url, token]
    injectors:
      env:
        NETBOX_URL: !unsafe "{{ url }}"
        NETBOX_TOKEN: !unsafe "{{ token }}"
      extra_vars:
        netbox_url: !unsafe "{{ url }}"
        netbox_token: !unsafe "{{ token }}"

  - name: DemoJam | NetBox Admin
    description: NetBox superuser created by deploy_netbox_community.yml
    kind: cloud
    inputs:
      fields:
        - id: username
          type: string
          label: Admin Username
        - id: password
          type: string
          label: Admin Password
          secret: true
        - id: email
          type: string
          label: Admin Email
      required: [username, password]
    injectors:
      extra_vars:
        netbox_admin_user: !unsafe "{{ username }}"
        netbox_admin_pass: !unsafe "{{ password }}"
        netbox_admin_email: !unsafe "{{ email }}"

  # The built-in "Network" type can't be used: it injects ANSIBLE_NET_*
  # env vars, but ansible.netcommon.network_cli only reads the password
  # from ansible_password / ansible_ssh_pass.
  - name: DemoJam | Arista Switch Login
    description: Login + enable password for the Arista cEOS switches (network_cli)
    kind: cloud
    inputs:
      fields:
        - id: username
          type: string
          label: Username
        - id: password
          type: string
          label: Password
          secret: true
        - id: enable_password
          type: string
          label: Enable Password
          secret: true
      required: [username, password]
    injectors:
      extra_vars:
        ansible_user: !unsafe "{{ username }}"
        ansible_password: !unsafe "{{ password }}"
        ansible_become_password: !unsafe "{{ enable_password | default('') }}"

  # Replaces DemoJamNetDriftCred from the old instance (NetBox token moved
  # to "DemoJam | NetBox API"; AAP URL added so the old EC2 default in
  # network-drift-manager.yaml is never used).
  - name: DemoJam | Network Drift Secrets
    description: MaaS, GitHub MCP and AAP callback secrets for network-drift-manager.yaml
    kind: cloud
    inputs:
      fields:
        - id: maas_api_key
          type: string
          label: MaaS API Key
          secret: true
        - id: github_mcp_token
          type: string
          label: GitHub MCP Token
          secret: true
        - id: aap_url
          type: string
          label: AAP URL (this instance)
        - id: aap_token
          type: string
          label: AAP API Token (launches remediation templates)
          secret: true
      required: [aap_url]
    injectors:
      env:
        MAAS_API_KEY: !unsafe "{{ maas_api_key }}"
        GITHUB_MCP_TOKEN: !unsafe "{{ github_mcp_token }}"
        AAP_URL: !unsafe "{{ aap_url }}"
        AAP_TOKEN: !unsafe "{{ aap_token }}"
      extra_vars:
        aap_url: !unsafe "{{ aap_url }}"
